<svg width="100%" viewBox="0 0 680 390" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Tally input/output diagram</title>
<desc>Shows how data flows through Tally: the user interacts with the UI, which reads and writes to a local Dexie database first, queues changes in a sync engine, and only then pushes to and pulls from Supabase over the network — the local-first loop.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
text { font-family: -apple-system, Segoe UI, Roboto, sans-serif; fill: #1a1a1a; }
.th { font-size: 14px; font-weight: 600; }
.ts { font-size: 11px; fill: #555; }
rect { stroke: #999; fill: #fff; }
.c-teal rect { fill: #e6f4f3; stroke: #4a9d96; }
.c-coral rect { fill: #fdeee8; stroke: #d97757; }
line, path.arr { stroke: #333; stroke-width: 1.5; }
</style>

<g>
<rect x="160" y="15" width="100" height="32" rx="8" stroke-width="0.5"/>
<text class="th" x="210" y="31" text-anchor="middle" dominant-baseline="central">User</text>
</g>
<line x1="210" y1="47" x2="210" y2="118" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal">
<rect x="40" y="65" width="340" height="275" rx="20" stroke-width="0.5"/>
<text class="th" x="210" y="85" text-anchor="middle" dominant-baseline="central">Browser</text>
<text class="ts" x="210" y="103" text-anchor="middle" dominant-baseline="central">Runs fully offline</text>
</g>

<g>
<rect x="70" y="120" width="280" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="210" y="134" text-anchor="middle" dominant-baseline="central">UI (Svelte routes)</text>
<text class="ts" x="210" y="162" text-anchor="middle" dominant-baseline="central">Forms, lists, live views</text>
</g>

<line x1="210" y1="176" x2="210" y2="192" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

<g>
<rect x="70" y="192" width="280" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="210" y="206" text-anchor="middle" dominant-baseline="central">Local DB (Dexie)</text>
<text class="ts" x="210" y="234" text-anchor="middle" dominant-baseline="central">IndexedDB, instant read/write</text>
</g>

<line x1="210" y1="248" x2="210" y2="264" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

<g>
<rect x="70" y="264" width="280" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="210" y="278" text-anchor="middle" dominant-baseline="central">Sync engine</text>
<text class="ts" x="210" y="306" text-anchor="middle" dominant-baseline="central">Outbox queue, conflict checks</text>
</g>

<g class="c-coral">
<rect x="440" y="222" width="190" height="130" rx="20" stroke-width="0.5"/>
<text class="th" x="535" y="242" text-anchor="middle" dominant-baseline="central">Supabase</text>
<text class="ts" x="535" y="260" text-anchor="middle" dominant-baseline="central">Cloud backend</text>
</g>

<g>
<rect x="455" y="276" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="535" y="290" text-anchor="middle" dominant-baseline="central">Postgres + RLS</text>
<text class="ts" x="535" y="318" text-anchor="middle" dominant-baseline="central">Auth, storage, policies</text>
</g>

<text class="ts" x="395" y="278" text-anchor="middle" dominant-baseline="central">push / pull</text>
<line x1="350" y1="292" x2="440" y2="292" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
</svg>
