<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Tally entry routes</title>
<desc>Shows the top-level pages before entering a specific group: sign in or sign up leads to the dashboard, which lists the user's groups and offers creating a new group or joining one by code.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
text { font-family: -apple-system, Segoe UI, Roboto, sans-serif; fill: #1a1a1a; }
.th { font-size: 14px; font-weight: 600; }
.ts { font-size: 11px; fill: #555; }
rect { stroke: #999; fill: #fff; }
.c-teal rect { fill: #e6f4f3; stroke: #4a9d96; }
.c-coral rect { fill: #fdeee8; stroke: #d97757; }
.arr { stroke: #333; stroke-width: 1.5; }
</style>

<g>
<rect x="250" y="20" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="34" text-anchor="middle" dominant-baseline="central">/login, /signup</text>
<text class="ts" x="340" y="62" text-anchor="middle" dominant-baseline="central">Sign in or create account</text>
</g>
<line x1="340" y1="76" x2="340" y2="110" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal">
<rect x="230" y="110" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="124" text-anchor="middle" dominant-baseline="central">/ (dashboard)</text>
<text class="ts" x="340" y="152" text-anchor="middle" dominant-baseline="central">Lists your groups</text>
</g>

<path d="M340,166 L340,190 L170,190 L170,230" class="arr" fill="none" marker-end="url(#arrow)"/>
<path d="M340,166 L340,190 L510,190 L510,230" class="arr" fill="none" marker-end="url(#arrow)"/>
<line x1="340" y1="166" x2="340" y2="230" class="arr" marker-end="url(#arrow)"/>

<g>
<rect x="70" y="230" width="200" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="170" y="252" text-anchor="middle" dominant-baseline="central">/groups/new</text>
</g>

<g>
<rect x="410" y="230" width="200" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="510" y="252" text-anchor="middle" dominant-baseline="central">/groups/join</text>
</g>

<g class="c-coral">
<rect x="240" y="230" width="200" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="252" text-anchor="middle" dominant-baseline="central">/groups/[groupId]</text>
</g>
</svg>
