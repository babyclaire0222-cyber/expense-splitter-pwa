<svg width="100%" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Tally sync module relationships</title>
<desc>Shows how writeHelpers, syncQueue, syncEngine, schema, and mappers depend on each other. writeHelpers is the entry point every component calls — it enqueues into syncQueue, triggers syncEngine to push, and reads and writes the local database directly through schema. syncEngine drains the outbox from syncQueue and uses mappers to translate field names before talking to Supabase. schema sits underneath everything as the single shared Dexie instance.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
text { font-family: -apple-system, Segoe UI, Roboto, sans-serif; fill: #1a1a1a; }
.th { font-size: 14px; font-weight: 600; }
.ts { font-size: 11px; fill: #555; }
rect { stroke: #999; fill: #fff; }
.c-coral rect { fill: #fdeee8; stroke: #d97757; }
.c-teal rect { fill: #e6f4f3; stroke: #4a9d96; }
.arr { stroke: #333; stroke-width: 1.5; }
</style>

<g class="c-coral">
<rect x="240" y="20" width="200" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="42" text-anchor="middle" dominant-baseline="central">writeHelpers.ts</text>
</g>

<line x1="300" y1="64" x2="180" y2="140" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="220" y="95" text-anchor="middle" dominant-baseline="central">enqueues</text>

<line x1="380" y1="64" x2="500" y2="140" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="460" y="95" text-anchor="middle" dominant-baseline="central">triggers push</text>

<line x1="340" y1="64" x2="340" y2="260" class="arr" marker-end="url(#arrow)"/>

<g>
<rect x="40" y="140" width="210" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="145" y="162" text-anchor="middle" dominant-baseline="central">syncQueue.ts</text>
</g>

<g>
<rect x="430" y="140" width="210" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="535" y="162" text-anchor="middle" dominant-baseline="central">syncEngine.ts</text>
</g>

<line x1="430" y1="162" x2="250" y2="162" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="150" text-anchor="middle" dominant-baseline="central">drains outbox</text>

<text class="ts" x="360" y="220" text-anchor="middle" dominant-baseline="central">reads / writes</text>

<g class="c-teal">
<rect x="240" y="260" width="200" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="282" text-anchor="middle" dominant-baseline="central">schema.ts</text>
</g>

<line x1="535" y1="184" x2="535" y2="260" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="595" y="220" text-anchor="middle" dominant-baseline="central">translates</text>

<g>
<rect x="430" y="260" width="210" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="535" y="282" text-anchor="middle" dominant-baseline="central">mappers.ts</text>
</g>
</svg>
