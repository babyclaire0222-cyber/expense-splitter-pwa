<svg width="100%" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Tally group-scoped routes</title>
<desc>Shows the pages inside a specific group, all sharing a common bottom-nav layout: balances (the group's index page), the expense list which leads to creating or editing an expense, settle up for recording payments, and conflicts for resolving offline-edit collisions.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
text { font-family: -apple-system, Segoe UI, Roboto, sans-serif; fill: #1a1a1a; }
.th { font-size: 14px; font-weight: 600; }
.ts { font-size: 11px; fill: #555; }
rect { stroke: #999; fill: #fff; }
.c-coral rect { fill: #fdeee8; stroke: #d97757; }
.c-red rect { fill: #fdeaea; stroke: #d97070; }
.arr { stroke: #333; stroke-width: 1.5; }
</style>

<g class="c-coral">
<rect x="240" y="20" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="34" text-anchor="middle" dominant-baseline="central">Group layout</text>
<text class="ts" x="340" y="62" text-anchor="middle" dominant-baseline="central">Shared bottom nav</text>
</g>

<line x1="100" y1="110" x2="100" y2="110" class="arr" marker-end="url(#arrow)"/>
<path d="M340,76 L340,95 L100,95 L100,110" class="arr" fill="none" marker-end="url(#arrow)"/>
<line x1="340" y1="76" x2="340" y2="110" class="arr" marker-end="url(#arrow)"/>
<path d="M340,76 L340,95 L580,95 L580,110" class="arr" fill="none" marker-end="url(#arrow)"/>

<g>
<rect x="10" y="110" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="100" y="124" text-anchor="middle" dominant-baseline="central">Balances</text>
<text class="ts" x="100" y="152" text-anchor="middle" dominant-baseline="central">Group index page</text>
</g>

<g>
<rect x="250" y="110" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="124" text-anchor="middle" dominant-baseline="central">Expenses</text>
<text class="ts" x="340" y="152" text-anchor="middle" dominant-baseline="central">List, new, edit</text>
</g>

<g>
<rect x="490" y="110" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="580" y="124" text-anchor="middle" dominant-baseline="central">Settle up</text>
<text class="ts" x="580" y="152" text-anchor="middle" dominant-baseline="central">Transfers, payments</text>
</g>

<line x1="580" y1="166" x2="580" y2="200" class="arr" marker-end="url(#arrow)"/>

<g class="c-red">
<rect x="490" y="200" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="580" y="214" text-anchor="middle" dominant-baseline="central">Conflicts</text>
<text class="ts" x="580" y="242" text-anchor="middle" dominant-baseline="central">Only visible if any exist</text>
</g>
</svg>
