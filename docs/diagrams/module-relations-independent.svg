<svg width="100%" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Tally independent module relationships</title>
<desc>Shows that lib/ledger (splitEngine, balances, debtSimplifier) and liveQuery.svelte.ts have zero dependency on the sync machinery. Both are consumed directly by Svelte components. The ledger folder is pure computation with no awareness of Dexie or Supabase, which is what makes it independently unit-testable.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
text { font-family: -apple-system, Segoe UI, Roboto, sans-serif; fill: #1a1a1a; }
.th { font-size: 14px; font-weight: 600; }
.ts { font-size: 11px; fill: #555; }
rect { stroke: #999; fill: #fff; }
.c-green rect { fill: #e8f5e9; stroke: #4caf7d; }
.arr { stroke: #333; stroke-width: 1.5; }
</style>

<g class="c-green">
<rect x="60" y="20" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="170" y="34" text-anchor="middle" dominant-baseline="central">lib/ledger/</text>
<text class="ts" x="170" y="62" text-anchor="middle" dominant-baseline="central">Pure functions, no Dexie</text>
</g>

<g class="c-green">
<rect x="400" y="20" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="510" y="34" text-anchor="middle" dominant-baseline="central">liveQuery.svelte.ts</text>
<text class="ts" x="510" y="62" text-anchor="middle" dominant-baseline="central">Generic reactive wrapper</text>
</g>

<line x1="220" y1="76" x2="300" y2="160" class="arr" marker-end="url(#arrow)"/>
<line x1="460" y1="76" x2="380" y2="160" class="arr" marker-end="url(#arrow)"/>

<g>
<rect x="230" y="160" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="174" text-anchor="middle" dominant-baseline="central">Svelte components</text>
<text class="ts" x="340" y="202" text-anchor="middle" dominant-baseline="central">Call both directly</text>
</g>
</svg>
